[package]
name = "awww-daemon"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
common = { workspace = true }

waybackend = { version = "0.10", default-features = false }
rustix = { version = "1.1", default-features = false, features = [ "event", "runtime", "stdio", "use-explicitly-provided-auxv" ] }
smallvec  = { version = "1.15", default-features = false, features = [ "union" ] }
core_maths = { version = "0.1" }

talc = { version = "4.4", default-features = false, features = [ "lock_api" ] }

origin = { version = "0.26", default-features = false, features = [ "origin-start", "nightly", "signal" ] }

[build-dependencies]
waybackend-scanner = { version = "0.10", features = ["build-script"] }
